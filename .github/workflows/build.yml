name: Build App Packages
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flet and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet

      - name: Build Android APK
        run: |
          flet build apk --no-interactive

      - name: Save Mobile App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-package
          path: build/apk/
